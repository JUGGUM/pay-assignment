spring:
  threads:
    virtual:
      enabled: true  # Java 21 가상 스레드 활성화 - I/O 블로킹 시 캐리어 스레드를 점유하지 않음

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true  # 개발 중 H2 콘솔 확인용 (localhost:8080/h2-console)

  # Redis (Redisson) - 로컬 개발 시 기본 포트 사용
  # 분산 락 테스트 없이 실행하려면 redisson.yml 에서 설정
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace  # 파라미터 바인딩 확인용